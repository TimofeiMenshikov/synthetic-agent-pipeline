[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-agent-pipeline"
version = "0.1.0"
description = "Reproducible CSV/SQLite agent tasks, verified trajectories and SFT export"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
synthetic-agent-pipeline = "synthetic_agent_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["synthetic_agent_pipeline*"]

[tool.setuptools.package-data]
synthetic_agent_pipeline = ["configs/*.json"]
